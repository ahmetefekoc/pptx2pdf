<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPTX → PDF</title>
<style>
:root{--bg:#edf0ec;--ink:#17211c;--mute:#5c6a62;--line:#c4cec7;--accent:#0e6b5c;--accent-ink:#fff;--card:#fafbfa;--warn:#9a3412}
@media (prefers-color-scheme:dark){:root{--bg:#121916;--ink:#e6ece8;--mute:#93a39a;--line:#2f3d36;--accent:#3fb59f;--accent-ink:#06201a;--card:#192220;--warn:#f0a070}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:48px 20px 64px}
h1{font:600 clamp(2rem,5vw,3.2rem)/1.1 "Iowan Old Style","Palatino Linotype",Georgia,serif;margin:0 0 28px;letter-spacing:-.01em}
#drop{display:block;border:2px dashed var(--line);border-radius:6px;background:var(--card);padding:36px 24px;cursor:pointer;transition:border-color .15s,background .15s}
#drop:hover,#drop.over,#drop:focus-within{border-color:var(--accent)}
#drop strong{display:block;font-size:1.1rem}
#file{position:absolute;opacity:0;width:1px;height:1px}
.row{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;margin:24px 0}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
button{font:inherit;font-weight:600;border:0;border-radius:4px;padding:11px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,#file:focus-visible+*{outline:3px solid var(--accent);outline-offset:2px}
#status{min-height:1.6em;margin:0 0 8px;color:var(--mute)}
#status.err{color:var(--warn)}
#bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;visibility:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#viewport{margin-top:20px;overflow:hidden}
#stage{transform-origin:0 0}
#stage .pptx-preview-wrapper{background:transparent!important}
#stage .pptx-preview-slide-wrapper{box-shadow:0 1px 8px rgba(0,0,0,.18)}
</style>
</head>
<body>
<main>
  <h1>PPTX → PDF</h1>

  <label id="drop" for="file">
    <input id="file" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation">
    <strong id="dropTitle">.pptx seç ya da buraya bırak</strong>
  </label>

  <div class="row">
    <div>
      <label for="q" style="display:block;font-weight:600;margin-bottom:6px">Kalite</label>
      <select id="q">
        <option value="2">Standart</option>
        <option value="3" selected>Yüksek</option>
        <option value="4">Maksimum</option>
      </select>
    </div>
    <button id="go" disabled>PDF oluştur</button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
  <div id="bar"><i></i></div>

  <div id="viewport"><div id="stage"></div></div>
</main>

<script src="vendor/pptx-preview.umd.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/font.js"></script>
<script>
(function(){
  var RENDER_W = 1280;
  var $ = function(s){return document.querySelector(s)};
  var stage=$('#stage'), vp=$('#viewport'), go=$('#go'), statusEl=$('#status'), bar=$('#bar'), barFill=$('#bar i');
  var slides=[], baseName='sunum', busy=false;

  function say(t,err){statusEl.textContent=t;statusEl.className=err?'err':''}
  function progress(p){bar.style.visibility=p==null?'hidden':'visible';barFill.style.width=(p||0)*100+'%'}
  function fit(){
    var k=Math.min(1,vp.clientWidth/RENDER_W);
    stage.style.transform='scale('+k+')';
    vp.style.height=(stage.scrollHeight*k)+'px';
  }
  window.addEventListener('resize',function(){if(slides.length&&!busy)fit()});

  async function fullSize(fn){
    var prev=stage.style.transform;
    stage.style.transform='none';vp.style.height='auto';vp.style.overflow='visible';
    try{return await fn()}finally{vp.style.overflow='';stage.style.transform=prev;fit()}
  }

  async function draw(buf,w){
    RENDER_W=w;stage.innerHTML='';stage.style.width=w+'px';
    return pptxPreview.init(stage,{width:w,mode:'list'}).preview(buf);
  }

  async function load(file){
    if(!file)return;
    if(!/\.pptx$/i.test(file.name)){say(/\.ppt$/i.test(file.name)?'.ppt desteklenmiyor. Dosyayı .pptx olarak kaydet.':'Sadece .pptx dosyaları.',true);return}
    busy=true;go.disabled=true;slides=[];stage.innerHTML='';vp.style.height='0';
    baseName=file.name.replace(/\.pptx$/i,'');
    $('#dropTitle').textContent=file.name;
    say('Yükleniyor…');progress(.1);
    try{
      var buf=await file.arrayBuffer();
      var pptx=await draw(buf,1280);
      var nw=Math.round(pptx&&pptx.width)||0;
      if(nw&&nw!==1280)await draw(buf,nw);
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      await new Promise(function(r){setTimeout(r,400)});
      slides=Array.prototype.slice.call(stage.querySelectorAll('.pptx-preview-slide-wrapper'));
      if(!slides.length)throw new Error('Slayt bulunamadı');
      fit();
      say(slides.length+' slayt');
      go.disabled=false;
    }catch(e){
      console.error(e);
      say('Dosya okunamadı.',true);
    }finally{busy=false;progress(null)}
  }

  function addTextLayer(pdf,el){
    var er=el.getBoundingClientRect(),k=0.75;
    var walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),range=document.createRange(),n;
    while((n=walker.nextNode())){
      var txt=n.nodeValue,re=/\S+/g,m;
      while((m=re.exec(txt))){
        range.setStart(n,m.index);range.setEnd(n,m.index+m[0].length);
        var r=range.getBoundingClientRect();
        if(r.width<1||r.height<1)continue;
        var fs=r.height*k*0.85;
        pdf.setFontSize(fs);pdf.setCharSpace(0);
        var tw=pdf.getTextWidth(m[0]);
        pdf.setCharSpace(m[0].length>1?(r.width*k-tw)/m[0].length:0);
        pdf.text(m[0],(r.left-er.left)*k,(r.top-er.top+r.height*0.8)*k,{renderingMode:'invisible'});
      }
    }
    pdf.setCharSpace(0);
  }

  async function exportImage(){
    var q=parseFloat($('#q').value),pdf=null,hasFont=false;
    await fullSize(async function(){
      for(var i=0;i<slides.length;i++){
        var el=slides[i],w=el.offsetWidth,h=el.offsetHeight,o=w>=h?'l':'p',W=w*0.75,H=h*0.75;
        say((i+1)+' / '+slides.length);progress(i/slides.length);
        var c=await html2canvas(el,{scale:q,backgroundColor:'#ffffff',useCORS:true,logging:false});
        var img=c.toDataURL('image/jpeg',0.92);
        if(!pdf){
          pdf=new window.jspdf.jsPDF({orientation:o,unit:'pt',format:[W,H]});
          try{pdf.addFileToVFS('t.ttf',window.TEXT_FONT_B64);pdf.addFont('t.ttf','T','normal');hasFont=true}catch(e){console.error(e)}
        }else pdf.addPage([W,H],o);
        pdf.addImage(img,'JPEG',0,0,W,H,undefined,'FAST');
        if(hasFont){try{pdf.setFont('T','normal');addTextLayer(pdf,el)}catch(e){console.error(e)}}
        c.width=c.height=0;
        await new Promise(function(r){setTimeout(r)});
      }
    });
    progress(1);pdf.save(baseName+'.pdf');say('Hazır');
  }

  go.addEventListener('click',async function(){
    if(busy||!slides.length)return;
    busy=true;go.disabled=true;
    try{
      await exportImage();
    }catch(e){console.error(e);say('PDF oluşturulamadı. Kaliteyi düşür.',true)}
    finally{busy=false;go.disabled=false;setTimeout(function(){progress(null)},800)}
  });

  var input=$('#file'),drop=$('#drop');
  input.addEventListener('change',function(){load(input.files[0])});
  ['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(e){load(e.dataTransfer.files[0])});
})();
</script>
</body>
</html>
